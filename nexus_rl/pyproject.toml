[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-nexus_rl"
version = "0.1.0"
description = "Nexus Rl environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.2.3",
    "numpy>=2.2.6",
    "openenv-core[core]>=0.2.2",
    "pandas>=2.3.3",
    "pydantic>=2.13.3",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m nexus_rl.server.app
server = "nexus_rl.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["nexus_rl", "nexus_rl.server"]
package-dir = { "nexus_rl" = ".", "nexus_rl.server" = "server" }
